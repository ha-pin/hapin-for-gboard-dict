name: Build and publish dictionary

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, test, and release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dictionary
        run: make build

      - name: Run tests
        run: make typecheck test

      - name: Create checksums
        run: sha256sum dist/*.txt dist/*.zip > dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          notes="Automated Gboard dictionary build for commit [\`${short_sha}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              dist/PersonalDictionary-hapin-zh-CN.zip \
              dist/PersonalDictionary-hapin-zh-TW.zip \
              dist/dictionary-zh-CN.txt \
              dist/dictionary-zh-TW.txt \
              dist/SHA256SUMS \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              dist/PersonalDictionary-hapin-zh-CN.zip \
              dist/PersonalDictionary-hapin-zh-TW.zip \
              dist/dictionary-zh-CN.txt \
              dist/dictionary-zh-TW.txt \
              dist/SHA256SUMS \
              --target "${GITHUB_SHA}" \
              --title "Hapin Gboard dictionary #${GITHUB_RUN_NUMBER} (${short_sha})" \
              --notes "${notes}"
          fi
